# Agent Failure Recovery — 智能体故障恢复工作流
#
# 触发条件：
#   1. 定时检查：每 6 小时自动扫描
#   2. 手动触发：workflow_dispatch
#
# 功能：
#   1. 使用 gh CLI 查询最近 agent workflow 状态
#   2. 失败时运行核心门禁验证
#   3. 创建 escalation issue

name: Agent Failure Recovery

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      target_workflow:
        description: "指定检查的工作流（留空检查全部）"
        required: false
        type: choice
        options:
          - all
          - "Agent Daily Cadence"
          - "Agent Weekly Cadence"
          - "Agent Monthly Cadence"

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: agent-failure-recovery
  cancel-in-progress: false

jobs:
  check-and-recover:
    name: "故障检测与恢复"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: 检查 agent workflow 状态
        id: health
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.event.inputs.target_workflow || 'all' }}
        run: |
          set -euo pipefail
          FAILED=0
          FAILED_RUNS_FILE="${RUNNER_TEMP}/failed-agent-runs.tsv"
          : > "${FAILED_RUNS_FILE}"
          {
            echo "## Agent Workflow Health"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          WORKFLOWS=("Agent Daily Cadence" "Agent Weekly Cadence" "Agent Monthly Cadence")

          for WF in "${WORKFLOWS[@]}"; do
            if [ "${TARGET}" != "all" ] && [ "${WF}" != "${TARGET}" ]; then
              continue
            fi

            echo "checking ${WF}..." >> "$GITHUB_STEP_SUMMARY"

            RUN_INFO=$(gh run list --workflow="${WF}" --limit 1 --json conclusion,status,databaseId,url)
            CONCLUSION=$(echo "${RUN_INFO}" | jq -r '.[0].conclusion // ""')

            if [ "${CONCLUSION}" = "failure" ]; then
              FAILED=$((FAILED + 1))
              RUN_ID=$(echo "${RUN_INFO}" | jq -r '.[0].databaseId // ""')
              RUN_URL=$(echo "${RUN_INFO}" | jq -r '.[0].url // ""')
              if [ -z "${RUN_ID}" ]; then
                echo "::error::Failed run for ${WF} did not include databaseId."
                exit 1
              fi
              printf '%s\t%s\t%s\n' "${WF}" "${RUN_ID}" "${RUN_URL}" >> "${FAILED_RUNS_FILE}"
              echo "- [FAIL] ${WF} (run ${RUN_ID})" >> "$GITHUB_STEP_SUMMARY"
            elif [ "${CONCLUSION}" = "success" ]; then
              echo "- [OK] ${WF}" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- [N/A] ${WF}: ${CONCLUSION:-not run}" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "failed=${FAILED}" >> "$GITHUB_OUTPUT"
          echo "failed_runs_file=${FAILED_RUNS_FILE}" >> "$GITHUB_OUTPUT"

          if [ "${FAILED}" -eq 0 ]; then
            echo "All agent workflows healthy" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: pnpm/action-setup@v6
        if: ${{ steps.health.outputs.failed > 0 }}
        with:
          version: 11.9.0

      - uses: actions/setup-node@v6
        if: ${{ steps.health.outputs.failed > 0 }}
        with:
          node-version: "22"
          cache: "pnpm"

      - if: ${{ steps.health.outputs.failed > 0 }}
        run: pnpm install --frozen-lockfile

      - name: 安装 Playwright Chromium
        if: ${{ steps.health.outputs.failed > 0 }}
        run: pnpm exec playwright install --with-deps chromium

      - name: 运行门禁
        if: ${{ steps.health.outputs.failed > 0 }}
        run: |
          pnpm build:schema && pnpm check
          echo "✅ 核心门禁通过"

      - name: Reconcile escalation incidents
        if: ${{ always() && steps.health.outputs.failed > 0 }}
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_RUNS_FILE: ${{ steps.health.outputs.failed_runs_file }}
        run: |
          set -euo pipefail
          RECOVERY_FAILURES=0
          while IFS=$'\t' read -r WORKFLOW_NAME RUN_ID RUN_URL; do
            [ -n "${RUN_ID}" ] || continue
            if ! node scripts/recovery-incident.mjs --workflow "${WORKFLOW_NAME}" --run-id "${RUN_ID}" --run-url "${RUN_URL}"; then
              RECOVERY_FAILURES=$((RECOVERY_FAILURES + 1))
              echo "::error::Recovery reconciliation failed for ${WORKFLOW_NAME} run ${RUN_ID}."
            fi
          done < "${FAILED_RUNS_FILE}"

          if [ "${RECOVERY_FAILURES}" -gt 0 ]; then
            echo "::error::${RECOVERY_FAILURES} recovery reconciliation(s) failed."
            exit 1
          fi
