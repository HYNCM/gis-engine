# Bundle Size Check - SDK 体积监控
#
# `config/package-size-budgets.json` is the only budget authority. The checker
# reports canonical complete-dist gzip bytes and treats 5% baseline growth as
# advisory while package budget breaches remain blocking.

name: Bundle Size

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/**"
      - "tsconfig*.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "config/package-size-budgets.json"
      - "scripts/check-package-size.mjs"
      - "scripts/package-size-policy.mjs"
      - "tests/framework/package-size-policy.test.ts"
      - "package.json"
      - ".github/workflows/bundle-size.yml"
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "tsconfig*.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "config/package-size-budgets.json"
      - "scripts/check-package-size.mjs"
      - "scripts/package-size-policy.mjs"
      - "tests/framework/package-size-policy.test.ts"
      - "package.json"
      - ".github/workflows/bundle-size.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  size-check:
    name: "体积检查"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: 按权威构建配方执行体积门禁
        run: pnpm size:check -- --github-summary
